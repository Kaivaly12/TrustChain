version: '3.8'

services:
  # Python 3.11 FastAPI Verification Engine Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trusttag-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - POLYGON_RPC_URL=https://rpc-amoy.polygon.technology
      - PINATA_IPFS_GATEWAY=https://gateway.pinata.cloud/ipfs/
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # In-Memory Cache for Rate Limiting & Scan Telemetry Logs
  redis:
    image: redis:7-alpine
    container_name: trusttag-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Frontend Consumer Scanner & Admin Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trusttag-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
